<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
</head>

<body class="back_log">
  <div class="registro-container">
    <div class="registro-card">
      <h1>Cadastro</h1>
      
      <form method="post" action="{{ url_for('auth.register') }}">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">Seu e-mail</label>
          <input type="email" id="email" name="email" placeholder="contato@meuemail.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Sua senha</label>
          <input type="password" id="senha" name="senha" placeholder="****" required>
        </div>

        <button type="submit" class="btn-registro">Cadastrar</button>
      </form>

      <div class="registro-footer">
        <p>Já tem conta? <a href="{{ url_for('auth.login') }}" class="link-login">Faça login</a></p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="messages">
            {% for cat, msg in messages %}
              <li><strong>{{ cat }}:</strong> {{ msg }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
    </div>
  </div>
</body>
</html>
